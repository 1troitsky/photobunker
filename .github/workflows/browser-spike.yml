name: Browser compatibility spike

on:
  pull_request:
    branches: [main, docs/product-foundation, 'codex/**']
    paths: ['tools/browser-spike/**', '.github/workflows/browser-spike.yml']
  push:
    branches: [main, docs/product-foundation, 'codex/**']
    paths: ['tools/browser-spike/**', '.github/workflows/browser-spike.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/browser-spike
    env:
      CI: 'true'
      PLAYWRIGHT_BROWSERS_PATH: /tmp/photobunker-playwright-browsers
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked lab dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Validate local device launcher
        run: node --check scripts/device.mjs
      - name: Install desktop browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build and test isolated lab
        run: npm test
